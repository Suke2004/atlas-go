name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Install templ
        run: go install github.com/a-h/templ/cmd/templ@latest
      - name: Generate templates
        run: templ generate
      - name: Run tests
        run: CGO_ENABLED=1 go test ./... -race
      - name: Build binary
        run: CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build -o build/atlas-linux-amd64 ./cmd/atlas
      - uses: softprops/action-gh-release@v2
        with:
          files: build/*
          generate_release_notes: true